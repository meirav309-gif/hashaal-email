name: Resend Hashaal Email To List

on:
  workflow_dispatch:      # ידני בלבד. שולח שוב לכל הרשימה את המוצרים שיצאו בתאריך הזה
    inputs:
      resend_date:
        description: 'תאריך (YYYY-MM-DD) של המייל לשליחה חוזרת'
        required: true
      subject:
        description: 'אופציונלי: נושא אחר למייל'
        required: false
        default: ''

jobs:
  resend-email:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install requests Pillow playwright

      - name: Install Playwright browser
        run: playwright install chromium --with-deps

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Send email
        run: node send_email_now.js
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          SMOOVE_TOKEN: ${{ secrets.SMOOVE_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          RESEND_DATE: ${{ inputs.resend_date }}
          SUBJECT_OVERRIDE: ${{ inputs.subject }}
